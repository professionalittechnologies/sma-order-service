apiVersion: apps/v1
kind: Deployment
metadata:
  name: sma-order
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sma-order
  template:
    metadata:
      labels:
        app: sma-order
    spec:
      containers:
        - name: sma-order
          image: manish28/sma-order-service
          ports:
            - containerPort: 8080